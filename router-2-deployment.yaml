apiVersion: apps/v1
kind: Deployment
metadata:
  name: router-2
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: router-2
  template:
    metadata:
      labels:
        app: router-2
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{"name": "ospf-link", "interface": "net1", "ips": ["10.10.10.3/24"]}]'
    spec:
      containers:
      - name: frr
        image: frrouting/frr:latest
        securityContext:
          privileged: true
        command: ["/bin/sh", "-c"]
        args:
          - |
            sysctl -w net.ipv4.ip_forward=1
            sed -i 's/ospfd=no/ospfd=yes/' /etc/frr/daemons
            /usr/lib/frr/frrinit.sh start
            sleep infinity
